<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sosa Tech Brand Asset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--carbon:#080a0f;--surface:#0d1117;--card:#131820;--border:#1e2731;--teal:#00e5c8;--white:#f0f4f8;--steel:#91a1b2}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--carbon)}
    .asset{position:relative;width:100vw;height:100vh;overflow:hidden;color:var(--white);background:radial-gradient(circle at 72% 25%,rgba(0,229,200,.13),transparent 28%),linear-gradient(140deg,var(--surface),var(--carbon) 66%);font-family:"DM Sans",sans-serif}
    .asset::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(145,161,178,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(145,161,178,.075) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(90deg,transparent,#000 25%,#000 92%,transparent)}
    .asset::after{content:"";position:absolute;left:0;top:0;width:34%;height:8px;background:var(--teal)}
    .cover{padding:46px 106px 42px 410px;display:flex;align-items:center}
    .cover .copy{position:relative;z-index:2;width:100%}
    .cover .logo{width:270px;margin-bottom:24px}
    .cover h1{font:800 68px/.94 "Syne",sans-serif;letter-spacing:-.055em;margin:0;max-width:940px}
    .cover h1 span{color:var(--teal)}
    .cover p{font:500 28px/1.3 "DM Sans",sans-serif;color:var(--steel);margin:22px 0 0}
    .cover .meta{font:500 20px/1.2 "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:20px}
    .cover .node-art{position:absolute;left:72px;top:50%;width:270px;height:270px;transform:translateY(-50%);opacity:.2}
    .highlight{display:flex;align-items:center;justify-content:center;text-align:center}
    .highlight .ring{width:720px;height:720px;border:8px solid rgba(0,229,200,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 90px rgba(0,229,200,.12)}
    .highlight .ring::before,.highlight .ring::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--teal);box-shadow:0 0 32px rgba(0,229,200,.7)}
    .highlight .ring::before{left:-17px;top:50%}.highlight .ring::after{right:-17px;top:50%}
    .highlight svg{width:300px;height:300px;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
    .highlight .label{position:absolute;top:1400px;left:80px;right:80px;font:800 94px/1 "Syne",sans-serif;letter-spacing:-.04em;text-transform:uppercase}
    .highlight .micro{position:absolute;top:1530px;left:80px;right:80px;font:500 27px/1.2 "DM Mono",monospace;letter-spacing:.14em;color:var(--steel);text-transform:uppercase}
  </style>
</head>
<body>
  <main class="asset" id="asset"></main>
  <script>
    const icons={
      start:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="4"/>',
      services:'<path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/>',
      results:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      automation:'<circle cx="4" cy="12" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 12h5c3 0 3-7 7-7M11 12c3 0 3 7 7 7"/>',
      websites:'<rect x="2" y="4" width="20" height="16" rx="1"/><path d="M2 8h20M6 6h.01M9 6h.01"/>',
      build:'<path d="m4 6 6 6-6 6M12 18h8"/>',
      faq:'<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.7 2.7 0 1 1 4.5 2c-1.2.9-2 1.4-2 3M12 18h.01"/>'
    };
    const labels={start:'Start Here',services:'Services',results:'Results',automation:'Automation',websites:'Websites',build:'Behind Build',faq:'FAQ'};
    const query=new URLSearchParams(location.search); const mode=query.get('mode')||'cover'; const key=query.get('key')||'start';
    const asset=document.getElementById('asset');
    if(mode==='cover'){
      asset.classList.add('cover');
      asset.innerHTML=`<img class="node-art" src="/assets/whatsapp-profile-icon.png" alt=""><div class="copy"><img class="logo" src="/assets/logo.svg" alt="Sosa Tech Solutions"><div class="meta">Miami · English / Español</div><h1>Websites, automation & AI that keep your business <span>moving.</span></h1><p>WE BUILD. YOU GROW.</p></div>`;
    }else{
      asset.classList.add('highlight');
      asset.innerHTML=`<div class="ring"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[key]||icons.start}</svg></div><div class="label">${labels[key]||labels.start}</div><div class="micro">Sosa Tech Solutions</div>`;
    }
    document.fonts.ready.then(()=>{document.documentElement.dataset.ready='true';document.title=`${mode}-${key}`});
  </script>
</body>
</html>
